name: ship-show-ask
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const found = ['ship', 'show', 'ask'].filter(c => pr.labels.some(l => l.name === c));
            if (found.length > 1) {
              core.setFailed(`Pick one of ship/show/ask (found: ${found.join(', ')})`);
              return;
            }
            const category = found[0] || 'ask';
            if (category !== 'ask') return;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            const approvers = new Set(reviews
              .filter(r => r.state === 'APPROVED' && r.user.login !== pr.user.login)
              .map(r => r.user.login));
            if (approvers.size < 1) {
              core.setFailed('ask waits for one approval, or label ship/show if that was the wrong call');
            }

  automerge-guard:
    runs-on: ubuntu-latest
    if: github.event.pull_request.auto_merge != null && !contains(github.event.pull_request.labels.*.name, 'ship')
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.graphql(`mutation($id: ID!) {
              disablePullRequestAutoMerge(input: {pullRequestId: $id}) { pullRequest { number } }
            }`, { id: context.payload.pull_request.node_id });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Auto-merge switched off: only `ship` PRs auto-merge. Relabel to `ship` if intended.',
            });
